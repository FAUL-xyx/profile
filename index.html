<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-[#0B0B0B] text-gray-200 min-h-screen flex flex-col items-center py-10 px-4 font-sans antialiased overflow-x-hidden selection:bg-[#d4af37] selection:text-black relative">

    <!-- Background Effects -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#d4af37] opacity-[0.03] blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#d4af37] opacity-[0.03] blur-[120px] rounded-full"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md w-full flex flex-col gap-6 z-10 animate-fade-in-up">
        
        <!-- Premium 3D Card -->
        <div class="premium-card relative bg-[#151515] border border-[#d4af37]/20 rounded-2xl p-8 shadow-[0_10px_40px_rgba(0,0,0,0.8)] overflow-hidden" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1" data-tilt-perspective="1000">
            <!-- Ornaments -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#d4af37] to-transparent opacity-70"></div>
            <div class="absolute bottom-0 right-0 w-16 h-16 border-b border-r border-[#d4af37]/30 rounded-br-2xl pointer-events-none"></div>
            <div class="absolute top-0 left-0 w-16 h-16 border-t border-l border-[#d4af37]/30 rounded-tl-2xl pointer-events-none"></div>

            <div class="flex flex-col items-center transform-style-3d relative z-10">
                <!-- Avatar -->
                <div class="relative mb-4 translate-z-20">
                    <div class="w-24 h-24 rounded-full p-1 border border-[#d4af37]/50 shadow-[0_0_15px_rgba(212,175,55,0.2)] bg-gradient-to-br from-[#2a2a2a] to-[#0a0a0a]">
                        <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" alt="Profile" class="w-full h-full object-cover rounded-full">
                    </div>
                    <!-- Status -->
                    <div id="profile-status-dot" class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-[#151515] rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.6)]"></div>
                </div>

                <!-- Info -->
                <h1 id="profile-name" class="text-2xl font-bold text-white tracking-wide translate-z-30 text-shadow-gold">John Doe</h1>
                <p id="profile-role" class="text-[#d4af37] text-sm font-medium tracking-widest uppercase mt-1 translate-z-20">Creative Developer</p>
                <p id="profile-bio" class="text-gray-400 text-center mt-4 text-sm leading-relaxed translate-z-10 max-w-[250px]">Building digital experiences with elegance and modern technologies.</p>

                <!-- Actions -->
                <div class="flex gap-4 mt-6 w-full translate-z-30">
                    <button id="btn-connect" class="flex-1 bg-gradient-to-r from-[#d4af37] to-[#b5952f] text-black font-semibold py-2.5 rounded-lg shadow-[0_0_15px_rgba(212,175,55,0.3)] hover:shadow-[0_0_25px_rgba(212,175,55,0.5)] transition-all active:scale-95 flex items-center justify-center gap-2">
                        <i class="fas fa-envelope"></i> Connect
                    </button>
                    <button id="btn-share" onclick="openShareModal()" class="flex-1 bg-[#222] border border-[#333] text-white font-semibold py-2.5 rounded-lg hover:bg-[#2a2a2a] hover:border-[#d4af37]/50 transition-all active:scale-95 flex items-center justify-center gap-2">
                        <i class="fas fa-share-nodes"></i> Share
                    </button>
                </div>
            </div>
        </div>

        <!-- Links Container -->
        <div id="links-container" class="flex flex-col gap-3 w-full pb-10">
            <!-- Dynamically populated -->
        </div>

    </div>
    
    <!-- Admin Float Button (For prototype purpose) -->
    <a href="admin.html" class="fixed bottom-6 right-6 bg-[#151515] border border-[#d4af37]/50 text-[#d4af37] w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:bg-[#d4af37] hover:text-black transition-all z-50">
        <i class="fas fa-pen"></i>
    </a>

    <!-- Share Modal -->
    <div id="share-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center opacity-0 transition-opacity duration-300">
        <div class="bg-[#151515] border border-[#d4af37]/30 rounded-2xl p-6 w-[90%] max-w-sm transform scale-95 transition-transform duration-300" id="share-modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">Share Profile</h3>
                <button onclick="closeShareModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="flex flex-col items-center mb-6">
                <div class="bg-white p-3 rounded-xl mb-3 shadow-[0_0_20px_rgba(212,175,55,0.2)]">
                    <div id="qrcode"></div>
                </div>
                <p class="text-sm text-gray-400">Scan to view profile</p>
            </div>

            <div class="space-y-2">
                <button onclick="copyLink()" class="w-full flex items-center gap-3 bg-[#222] hover:bg-[#2a2a2a] p-3 rounded-lg transition-colors border border-transparent hover:border-[#d4af37]/30">
                    <i class="fas fa-link text-[#d4af37]"></i>
                    <span>Copy Link</span>
                </button>
                <button onclick="shareNative()" class="w-full flex items-center gap-3 bg-[#222] hover:bg-[#2a2a2a] p-3 rounded-lg transition-colors border border-transparent hover:border-[#d4af37]/30">
                    <i class="fas fa-share text-[#d4af37]"></i>
                    <span>Share via Device</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
